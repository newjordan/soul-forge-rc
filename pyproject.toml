[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soulforge"
version = "0.1.0"
description = "Personality tuning harness for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "personality", "evaluation", "prompts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
soulforge = "soulforge.cli:main"

[project.urls]
Homepage = "https://github.com/newjordan/soul-forge-rc"
Repository = "https://github.com/newjordan/soul-forge-rc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soulforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
