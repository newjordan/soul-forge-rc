name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
        env:
          SOULFORGE_API_KEY: ""
          OPENAI_API_KEY: ""
      - name: Offline demo
        run: python -m soulforge demo
        env:
          SOULFORGE_API_KEY: ""
          OPENAI_API_KEY: ""
